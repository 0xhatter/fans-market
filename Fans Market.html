<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fans Market — Journey 1</title>
<style>
/* Fans Market — Netflix-styled dark mobile */
:root {
  --bg: #07070C;
  --bg-2: #0E0E16;
  --card: #15151F;
  --card-2: #1C1C28;
  --card-3: #24243A;
  --text: #FFFFFF;
  --text-dim: rgba(255,255,255,0.66);
  --text-faint: rgba(255,255,255,0.42);
  --text-mute: rgba(255,255,255,0.22);
  --border: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.14);
  --brand: #FF2D55;
  --brand-press: #E11D48;
  --accent: #FF6B3D;
  --live: #FF2D55;
  --win: #00E2A8;
  --gold: #FFC83D;
  --info: #5AC8FA;
  --warn: #FFD60A;
  --danger: #FF453A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050507;
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  background:
    radial-gradient(1200px 600px at 20% 0%, rgba(255,45,85,0.06), transparent 60%),
    radial-gradient(900px 500px at 90% 100%, rgba(255,107,61,0.05), transparent 60%),
    #050507;
}
button { font-family: var(--font); cursor: pointer; }
.fm-screen {
  width: 100%;
  min-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  -webkit-overflow-scrolling: touch;
}
.fm-screen::-webkit-scrollbar { display: none; }
.fm-screen { scrollbar-width: none; }
.row-rail {
  display: flex; gap: 10px;
  overflow-x: auto; overflow-y: hidden;
  padding: 4px 16px 18px;
  scroll-snap-type: x mandatory;
}
.row-rail::-webkit-scrollbar { display: none; }
.row-rail { scrollbar-width: none; }
.row-rail > * { scroll-snap-align: start; flex-shrink: 0; }
.rail-title {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 16px 10px;
}
.rail-title h3 {
  margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px;
}
.rail-title span {
  font-size: 12px; color: var(--text-faint); font-weight: 500;
}
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700;
  padding: 4px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.tag-live { background: var(--live); color: #fff; }
.tag-live .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #fff; animation: pulse 1.4s ease-in-out infinite;
}
.tag-soft {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
  border: 0.5px solid rgba(255,255,255,0.08);
}
.tag-win { background: rgba(0,226,168,0.15); color: var(--win); }
.tag-gold { background: rgba(255,200,61,0.15); color: var(--gold); }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}
.btn {
  appearance: none; border: 0; outline: 0;
  font-family: var(--font); font-weight: 700;
  border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--text); color: #000; padding: 14px 20px; font-size: 16px; }
.btn-secondary {
  background: rgba(255,255,255,0.12); color: var(--text);
  backdrop-filter: blur(20px); padding: 14px 20px; font-size: 16px;
}
.btn-brand {
  background: var(--brand); color: #fff;
  padding: 16px 20px; font-size: 17px; font-weight: 800; letter-spacing: -0.2px;
  box-shadow: 0 8px 24px rgba(255,45,85,0.35);
}
.btn-ghost {
  background: transparent; color: var(--text);
  border: 1px solid var(--border-2); padding: 12px 16px; font-size: 14px;
}
.btn-cta-full { width: 100%; padding: 16px; font-size: 17px; border-radius: 14px; }
.ph {
  position: relative;
  background: linear-gradient(135deg, var(--ph-1, #2a2a40) 0%, var(--ph-2, #14141f) 100%);
  overflow: hidden;
}
.ph::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(80% 60% at 30% 30%, rgba(255,255,255,0.08), transparent 60%),
    radial-gradient(60% 40% at 80% 90%, rgba(0,0,0,0.4), transparent 60%);
  pointer-events: none;
}
.ph-grain::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.08), transparent),
    radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.06), transparent),
    radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.05), transparent);
  background-size: 200px 200px;
  pointer-events: none;
  mix-blend-mode: overlay;
}
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 8px 4px 28px;
  background: linear-gradient(180deg, rgba(7,7,12,0) 0%, rgba(7,7,12,0.85) 30%, rgba(7,7,12,0.98) 100%);
  backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(255,255,255,0.06);
  z-index: 30;
}
.tabbar-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px;
  color: var(--text-faint);
  font-size: 10px; font-weight: 600;
  border: 0; background: transparent;
}
.tabbar-item.active { color: var(--text); }
.tabbar-item .ico { width: 22px; height: 22px; }
.topnav {
  position: sticky; top: 0; z-index: 25;
  padding: 50px 16px 12px;
  background: linear-gradient(180deg, rgba(7,7,12,0.96) 0%, rgba(7,7,12,0.65) 70%, rgba(7,7,12,0) 100%);
  backdrop-filter: blur(14px);
}
.topnav-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand-mark {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 900; letter-spacing: -0.4px; color: var(--text); line-height: 1;
}

}
.brand-mark .fm-word {
  display: inline-flex; align-items: baseline; letter-spacing: -0.04em;
}
.brand-mark .fm-word b { font-weight: 900; }
.brand-mark .fm-word .dot { color: var(--brand); }
.topnav-cats {
  display: flex; gap: 8px; margin-top: 14px;
  overflow-x: auto; scrollbar-width: none;
}
.topnav-cats::-webkit-scrollbar { display: none; }
.cat-pill {
  flex-shrink: 0;
  padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.1);
  color: var(--text); font-size: 13px; font-weight: 600;
}
.cat-pill.active { background: var(--text); color: #000; border-color: var(--text); }
.feature-card { width: 100%; border-radius: 16px; overflow: hidden; background: var(--card); }
.prob-bar {
  height: 8px; border-radius: 999px;
  background: rgba(255,255,255,0.08); overflow: hidden; position: relative;
}
.prob-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius: 999px;
}
.sheet-backdrop {
  position: absolute; inset: 0; background: rgba(0,0,0,0.65);
  backdrop-filter: blur(8px); z-index: 40;
  display: flex; align-items: flex-end;
}
.sheet {
  background: #18182A; width: 100%; border-radius: 28px 28px 0 0;
  padding: 12px 20px 36px; position: relative;
  max-height: 90%; overflow-y: auto;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-handle {
  width: 38px; height: 4px; border-radius: 999px;
  background: rgba(255,255,255,0.25); margin: 6px auto 18px;
}
.comp-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 0; border-bottom: 0.5px solid var(--border);
}
.comp-row:last-child { border-bottom: 0; }
.comp-check {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,226,168,0.15); color: var(--win);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 14px; font-weight: 800;
}
.comp-check.pending { background: rgba(255,255,255,0.08); color: var(--text-faint); }
.comp-check.running { background: rgba(90,200,250,0.15); color: var(--info); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i {
  position: absolute; top: -10px; width: 6px; height: 10px;
  animation: fall linear infinite;
}
@keyframes fall {
  0% { transform: translateY(-20px) rotate(0); opacity: 1; }
  100% { transform: translateY(800px) rotate(720deg); opacity: 0; }
}
.banner {
  margin: 0 16px 12px; padding: 10px 12px; border-radius: 10px;
  font-size: 12px; display: flex; align-items: center; gap: 8px; font-weight: 600;
}
.banner-browse {
  background: rgba(90,200,250,0.12); color: var(--info);
  border: 0.5px solid rgba(90,200,250,0.3);
}
.banner-blocked {
  background: rgba(255,69,58,0.12); color: var(--danger);
  border: 0.5px solid rgba(255,69,58,0.3);
}
.shimmer {
  background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.1), rgba(255,255,255,0.04));
  background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.ticker {
  display: flex; gap: 18px; white-space: nowrap;
  animation: ticker 30s linear infinite;
}
@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.ticker-wrap {

  border-bottom: 0.5px solid var(--border); padding: 8px 0; background: var(--bg-2);
}
.avatar {

  color: #fff; font-weight: 800; flex-shrink: 0;
}
.loadbar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
.loadbar > div { height: 100%; background: var(--info); border-radius: 999px; transition: width 0.6s ease; }
.is-disabled { opacity: 0.45; pointer-events: none; filter: grayscale(0.3); }
</style>

<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// ─── 4. LIGHT ONBOARDING ─────────────────────────────────────────

  const [tos, setTos] = React.useState(false);

    setFn(next);
  };

    { title: "Pick your sports", sub: "We'll personalize your arena, ticker, and picks." },

        {steps[step].sub}

          </div>

            </div>
          </button>

          <button onClick={() => setTos(!tos)} style={{
            width: "100%", textAlign: "left",
            background: tos ? "rgba(0,226,168,0.08)" : "var(--card)",
            border: "0.5px solid " + (tos ? "rgba(0,226,168,0.4)" : "var(--border)"),
            borderRadius: 14, padding: 14, color: "#fff",
            display: "flex", alignItems: "center", gap: 12,
          }}>
            <div style={{
              width: 22, height: 22, borderRadius: 6,
              background: tos ? "var(--win)" : "transparent",
              border: tos ? "0" : "1.5px solid rgba(255,255,255,0.25)",

            <div style={{ fontSize: 13, color: "rgba(255,255,255,0.85)", lineHeight: 1.4 }}>
              I agree to the <u>Terms</u>, <u>Privacy</u>, and <u>Responsible Play</u> commitments.
            </div>
          </button>

          <div style={{ background: "rgba(90,200,250,0.08)", border: "0.5px solid rgba(90,200,250,0.2)", borderRadius: 12, padding: 12, marginTop: 14, fontSize: 12, color: "rgba(90,200,250,0.95)", display: "flex", gap: 10 }}>
            <Icon name="info" size={16} color="var(--info)"/>
            <div>
              <b>No funding yet.</b> You can browse, follow creators, and join the Arena. Wallet only when you make a pick.
            </div>
          </div>
        </div>
      )}

      <button className="btn btn-brand btn-cta-full"
        onClick={() => step < 2 ? setStep(step + 1) : onDone()}
        style={{
          opacity: step === 2 && (!age || !tos) ? 0.4 : 1,
          pointerEvents: step === 2 && (!age || !tos) ? "none" : "auto",
        }}>
        {step < 2 ? "Continue" : "Enter the Arena"}
      </button>
    </div>
  );
};

Object.assign(window, { ProfilePicker, LiveDiscovery, EntryGate, LightOnboarding, SPORTS, TEAMS_NBA, PROFILES });

const PredictionSheet = ({ pick, funded, onClose, onSettle, access }) => {

  // 1 = fund wallet (skipped if already funded)

  // 3 = success → onSettle after a moment
  const [step, setStep] = React.useState(0);

      setTimeout(() => setChecks(prev => {
        const next = [...prev]; next[i] = true; return next;
      }), 500 + i * 600)

    return () => timers.forEach(clearTimeout);

  const allChecked = checks.every(Boolean);

                    <div style={{ fontSize: 14, fontWeight: 700 }}>{c.title}</div>
                    <div style={{ fontSize: 12, color: "var(--text-faint)", marginTop: 2 }}>{c.sub}</div>

            </div>

            <button className="btn btn-brand btn-cta-full"
              style={{ marginTop: 20, opacity: allChecked ? 1 : 0.4, pointerEvents: allChecked ? "auto" : "none" }}

        {step === 1 && (
          <>
            <div style={{ textAlign: "center", marginBottom: 18 }}>
              <Icon name="wallet" size={36} color="var(--brand)"/>

              Wallet is held by FanMarket Custody · audited daily

          </>
        )}

        {step === 2 && (
          <>
            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--brand)", letterSpacing: "0.1em" }}>FINAL CONFIRMATION</div>

<script type="text/babel">
// app.jsx — Fans Market prototype root.
// Routes between onboarding flow and the 5 main tabs.

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "audience": "fan",
  "access": "eligible",
  "discovery": "live",
  "funded": "pre",
  "startScreen": "profile"
}/*EDITMODE-END*/;

// screen choices: profile | discovery | gate | onboarding | app | pick | settle | blocked
// when screen === 'app', the active tab decides which tab page renders

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [screen, setScreen] = React.useState(t.startScreen === "home" ? "app" : (t.startScreen || "profile"));
  const [activeTab, setActiveTab] = React.useState("home");
  const [sheetOpen, setSheetOpen] = React.useState(false);
  const [activePick, setActivePick] = React.useState(null);
  const [settled, setSettled] = React.useState(null);

  // Tweak-driven jumps (Jump to screen dropdown)
  const lastStartScreen = React.useRef(t.startScreen);
  React.useEffect(() => {
    if (t.startScreen === lastStartScreen.current) return;
    lastStartScreen.current = t.startScreen;
    if (t.startScreen === "settle") {
      setSettled({ pick: { stake: 5, side: "yes", payout: "8.05", payoutMult: 1.61 }, outcome: "win" });
      setScreen("settle");
    } else if (t.startScreen === "home") {
      setScreen("app"); setActiveTab("home");
    } else if (t.startScreen === "live") {
      setScreen("app"); setActiveTab("live");
    } else if (t.startScreen === "wallet") {
      setScreen("app"); setActiveTab("wallet");
    } else if (t.startScreen === "me") {
      setScreen("app"); setActiveTab("me");
    } else {
      setScreen(t.startScreen);
    }
  }, [t.startScreen]);

  // Blocked overrides everything
  React.useEffect(() => {
    if (t.access === "blocked" && screen !== "blocked") setScreen("blocked");
  }, [t.access]);

  // ── Routing handlers ───────────────────────────
  const goHome = () => {
    setScreen("app");
    setActiveTab("home");
    setSettled(null);
    setSheetOpen(false);
  };

  const onTab = (id) => {
    setActiveTab(id);
    setScreen("app");
    setSettled(null);
    setSheetOpen(false);
  };

  const openPick = (id) => {
    setActivePick({ id });
    setScreen("pick");
  };

  const makePick = (pickData) => {
    setActivePick(pickData);
    setSheetOpen(true);
  };

  const settle = (pickData) => {
    setSheetOpen(false);
    const win = Math.random() > 0.35;
    setSettled({ pick: pickData, outcome: win ? "win" : "loss" });
    setScreen("settle");
  };

  // ── Render ─────────────────────────────────────
  // Blocked overlay
  if (t.access === "blocked" || screen === "blocked") {
    return (
      <>
        <Blocked onBack={() => { setTweak("access", "eligible"); setScreen("profile"); }}/>
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  // Onboarding flow
  if (screen === "profile") {
    return (
      <>
        <ProfilePicker onSelect={(p) => {
          if (p && !p.verified) setTweak("access", "browse");
          else if (p && p.verified && t.access === "browse") setTweak("access", "eligible");
          setScreen("discovery");
        }}/>
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  if (screen === "discovery") {
    return (
      <>
        <LiveDiscovery
          profile="M"
          organic={t.discovery === "organic"}
          onContinue={() => setScreen("gate")}
        />
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  if (screen === "gate") {
    return (
      <>
        <EntryGate onDone={() => setScreen("onboarding")}/>
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  if (screen === "onboarding") {
    return (
      <>
        <LightOnboarding audience={t.audience} onDone={() => { setScreen("app"); setActiveTab("home"); }}/>
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  // Pick detail
  if (screen === "pick") {
    return (
      <>
        <GuidedPick
          onBack={goHome}
          onMakePick={makePick}
          access={t.access}
          funded={t.funded === "post"}
        />
        {sheetOpen && (
          <PredictionSheet
            pick={activePick}
            funded={t.funded === "post"}
            access={t.access}
            onClose={() => setSheetOpen(false)}
            onSettle={settle}
          />
        )}
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  // Settlement
  if (screen === "settle" && settled) {
    return (
      <>
        <Settlement pick={settled.pick} outcome={settled.outcome} onContinue={goHome}/>
        <TweaksUI t={t} setTweak={setTweak}/>
      </>
    );
  }

  // ── Main app: tab routing ───────────────────────
  // Tab content shares a common shape: receives (access, audience, funded, onOpenPick, onTab, activeTab)
  const sharedProps = {
    access: t.access,
    audience: t.audience,
    funded: t.funded === "post",
    onOpenPick: openPick,
    onTab,
    activeTab,
  };

  let TabContent;
  if (activeTab === "home") {
    TabContent = t.audience === "bettor"
      ? <BettorHome {...sharedProps} onOpenLive={() => onTab("live")}/>
      : <Arena {...sharedProps} onOpenLive={() => onTab("live")}/>;
  } else if (activeTab === "live") {
    TabContent = <Live {...sharedProps}/>;
  } else if (activeTab === "pick") {
    TabContent = <Picks {...sharedProps}/>;
  } else if (activeTab === "wallet") {
    TabContent = <Wallet {...sharedProps} onFund={() => setTweak("funded", "post")}/>;
  } else if (activeTab === "me") {
    TabContent = <Me {...sharedProps}
      onLogout={() => { setScreen("profile"); setActiveTab("home"); }}
      onTweakAudience={() => setTweak("audience", t.audience === "fan" ? "bettor" : "fan")}/>;
  } else {
    TabContent = <Arena {...sharedProps} onOpenLive={() => onTab("live")}/>;
  }

  return (
    <>
      {TabContent}
      <TweaksUI t={t} setTweak={setTweak}/>
    </>
  );
}

// ─── Tweaks UI ──────────────────────────────────────────────────
function TweaksUI({ t, setTweak }) {
  return (
    <TweaksPanel title="Fans Market · Tweaks">
      <TweakSection label="Journey route"/>
      <TweakRadio label="Audience" value={t.audience}
        options={[{ value: "fan", label: "Fan-first" }, { value: "bettor", label: "Bettor" }]}
        onChange={(v) => setTweak("audience", v)}/>
      <TweakRadio label="Discovery" value={t.discovery}
        options={[{ value: "live", label: "Live" }, { value: "organic", label: "Organic" }]}
        onChange={(v) => setTweak("discovery", v)}/>

      <TweakSection label="Access state"/>
      <TweakRadio label="Access" value={t.access}
        options={[
          { value: "eligible", label: "Eligible" },
          { value: "browse", label: "Browse" },
          { value: "blocked", label: "Blocked" },
        ]}
        onChange={(v) => setTweak("access", v)}/>
      <TweakRadio label="Funded" value={t.funded}
        options={[{ value: "pre", label: "Pre" }, { value: "post", label: "Post" }]}
        onChange={(v) => setTweak("funded", v)}/>

      <TweakSection label="Jump to screen"/>
      <TweakSelect label="Screen" value={t.startScreen}
        options={[
          { value: "profile", label: "Onboarding · Profile picker" },
          { value: "discovery", label: "Onboarding · Live discovery" },
          { value: "gate", label: "Onboarding · Entry Gate" },
          { value: "onboarding", label: "Onboarding · Light setup" },
          { value: "home", label: "Tab · Home (Arena)" },
          { value: "live", label: "Tab · Live" },
          { value: "wallet", label: "Tab · Wallet" },
          { value: "me", label: "Tab · Me" },
          { value: "pick", label: "Flow · Guided pick" },
          { value: "settle", label: "Flow · Settlement" },
        ]}
        onChange={(v) => setTweak("startScreen", v)}/>
    </TweaksPanel>
  );
}

// ─── Mount ─────────────────────────────────────────────────────
function Root() {
  return (
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "center",
      minHeight: "100vh",
    }}>
      <IOSDevice width={402} height={874} dark={true}>
        <App/>
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);

</script>
</body>
</html>
